name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: osquery, gateway and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t osquery-client:ci .
      - name: osquery runs and the schedule parses
        run: |
          docker run --rm --entrypoint /opt/osquery/bin/osqueryd osquery-client:ci --version
          for conf in config/osquery.conf test/osquery.e2e.conf; do
            docker run --rm -v "$PWD/$conf:/c.conf:ro" --entrypoint /opt/osquery/bin/osqueryd osquery-client:ci \
              --config_path=/c.conf --config_check
          done
      - name: gateway config and transform tests
        run: |
          docker run --rm -v "$PWD/gateway":/etc/osquery-gateway:ro -e NATS_URL=nats://127.0.0.1:4222 \
            timberio/vector:0.53.0-distroless-libc \
            test /etc/osquery-gateway/vector.yaml /etc/osquery-gateway/tests/osquery_split.yaml
      # Client -> gateway -> NATS over mutual TLS with a throwaway CA, plus the
      # refusal checks (no certificate, another CA, plain HTTP).
      - name: end-to-end
        run: test/e2e.sh

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action needs a paid licence for organisations; the CLI does not.
      - name: gitleaks
        run: |
          curl -sSfL --retry 3 --retry-all-errors -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  trivy:
    name: trivy (image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t osquery-client:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: osquery-client:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # Pushes ghcr.io/samma-io/osquery-client:<short sha> once every check on main
  # has passed. Pull requests never push.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, gitleaks, trivy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build and push
        run: |
          docker build -t "ghcr.io/samma-io/osquery-client:${GITHUB_SHA::7}" .
          docker push "ghcr.io/samma-io/osquery-client:${GITHUB_SHA::7}"
