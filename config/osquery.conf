{
  "options": {
    "schedule_splay_percent": "10"
  },
  "schedule": {
    "samma_heartbeat": {
      "query": "SELECT i.version, i.pid, i.start_time, t.unix_time FROM osquery_info i, time t;",
      "interval": 300,
      "removed": false,
      "description": "One 'added' row every 5 minutes: proves the client -> gateway -> SIEM path. Not a snapshot, so it goes through the normal results path."
    },
    "samma_listening_ports": {
      "query": "SELECT lp.pid, p.name, lp.port, lp.protocol, lp.family, lp.address FROM listening_ports lp LEFT JOIN processes p USING (pid) WHERE lp.port != 0;",
      "interval": 600,
      "description": "Network listeners and the process that owns them (needs --network=host and --pid=host for the host's view). Unix sockets are left out."
    },
    "samma_processes": {
      "query": "SELECT pid, parent, name, path, uid FROM processes;",
      "interval": 3600,
      "description": "Running processes (needs --pid=host). The command line is left out because it can carry secrets."
    },
    "samma_logged_in_users": {
      "query": "SELECT type, user, tty, host, time FROM logged_in_users WHERE type = 'user';",
      "interval": 600,
      "description": "Interactive sessions (needs /var/run/utmp mounted read-only)."
    },
    "samma_kernel_uptime": {
      "query": "SELECT k.version AS kernel, u.days AS uptime_days FROM kernel_info k, uptime u;",
      "interval": 3600,
      "description": "Kernel version and uptime in days; a change means a reboot or a kernel update."
    },

    "samma_process_events": {
      "query": "SELECT pid, parent, uid, gid, syscall, path, cwd, exit_code, time FROM bpf_process_events WHERE path NOT LIKE '/usr/local/go/pkg/tool/%' AND path NOT LIKE '/usr/lib/go-%/pkg/tool/%' AND path NOT LIKE '/usr/libexec/gcc/%' AND path NOT LIKE '/proc/self/fd/%' AND path NOT IN ('/usr/bin/runc', '/usr/sbin/runc', '/usr/bin/containerd-shim-runc-v2', '/usr/bin/gcc', '/usr/bin/cc', '/usr/bin/as', '/usr/bin/ld', '/usr/bin/x86_64-linux-gnu-ld.bfd', '/usr/sbin/iptables', '/usr/sbin/ip6tables', '/usr/sbin/xtables-nft-multi', '/usr/sbin/xtables-legacy-multi', '/bin/loginctl', '/usr/bin/loginctl', '/bin/ps', '/usr/bin/ps', '/usr/bin/pgrep', '/usr/local/bin/pg_isready', '/usr/bin/pg_isready');",
      "interval": 60,
      "description": "Programs started on the host, from eBPF (needs OSQUERY_EVENTS and the event privileges). The command line is left out because it can carry secrets. Compilers, container runtimes, firewall tooling and polling commands (ps, pgrep, loginctl, pg_isready) are left out: on a busy host they are most of the volume and none of the signal."
    },
    "samma_socket_events": {
      "query": "SELECT pid, parent, uid, path, syscall, family, protocol, local_address, local_port, remote_address, remote_port, time FROM bpf_socket_events WHERE syscall IN ('connect', 'accept') AND family IN (2, 10) AND remote_address != '' AND remote_address NOT LIKE '127.%' AND remote_address != '::1' AND remote_address NOT LIKE '::ffff:127.%' AND remote_port != 53;",
      "interval": 60,
      "description": "Outbound connects and inbound accepts over IPv4/IPv6, from eBPF. Loopback and DNS lookups (port 53) are left out."
    },
    "samma_file_events": {
      "query": "SELECT SUBSTR(target_path, 6) AS path, category, action, uid, gid, mode, size, time FROM file_events;",
      "interval": 60,
      "description": "Changes under the watched host paths (file_paths below, inotify on the read-only /host mount). Paths are reported without the /host prefix."
    },
    "samma_users": {
      "query": "SELECT uid, gid, username, shell, directory FROM users;",
      "interval": 600,
      "description": "Local accounts (needs the host's /etc/passwd mounted)."
    },
    "samma_admin_group_members": {
      "query": "SELECT u.username, u.uid, g.groupname, g.gid FROM user_groups ug JOIN users u ON u.uid = ug.uid JOIN groups g ON g.gid = ug.gid WHERE g.groupname IN ('root', 'sudo', 'wheel', 'adm', 'docker');",
      "interval": 600,
      "description": "Who is in a group that grants root or root-equivalent access (needs the host's /etc/passwd and /etc/group)."
    },
    "samma_authorized_keys": {
      "query": "SELECT u.username, ak.uid, ak.algorithm, ak.key_file, ak.key FROM users u CROSS JOIN authorized_keys ak USING (uid);",
      "interval": 600,
      "description": "SSH public keys that can log in (needs /home and /root mounted). Public keys only."
    },
    "samma_crontab": {
      "query": "SELECT event, minute, hour, day_of_month, month, day_of_week, command, path FROM crontab;",
      "interval": 600,
      "description": "System and user crontabs (needs /etc/crontab, /etc/cron.d and /var/spool/cron mounted)."
    },
    "samma_sudoers": {
      "query": "SELECT source, header, rule_details FROM sudoers;",
      "interval": 600,
      "description": "sudo rules (needs /etc/sudoers and /etc/sudoers.d mounted)."
    },
    "samma_kernel_modules": {
      "query": "SELECT name, status FROM kernel_modules;",
      "interval": 600,
      "description": "Loaded kernel modules. Size and users are left out because they change all the time."
    },
    "samma_last_logins": {
      "query": "SELECT username, tty, pid, type, host, time FROM last;",
      "interval": 600,
      "description": "Login and logout history (needs /var/log/wtmp mounted)."
    },
    "samma_packages": {
      "query": "SELECT name, version, arch, 'deb' AS kind FROM deb_packages UNION ALL SELECT name, version, arch, 'rpm' AS kind FROM rpm_packages;",
      "interval": 3600,
      "description": "Installed packages (needs /var/lib/dpkg or /var/lib/rpm mounted)."
    },
    "samma_suid_binaries": {
      "query": "SELECT SUBSTR(path, 6) AS path, uid, gid, mode FROM file WHERE directory IN ('/host/usr/bin', '/host/usr/sbin', '/host/usr/local/bin', '/host/usr/local/sbin') AND type = 'regular' AND (mode GLOB '[246]???');",
      "interval": 3600,
      "description": "Setuid and setgid programs in the host's binary folders (needs / mounted at /host)."
    },
    "samma_os_version": {
      "query": "SELECT name, version, codename, platform FROM os_version;",
      "interval": 3600,
      "description": "Distribution and version (needs the host's /etc/os-release mounted)."
    }
  },
  "file_paths": {
    "accounts": [
      "/host/etc/passwd",
      "/host/etc/shadow",
      "/host/etc/group",
      "/host/etc/gshadow",
      "/host/etc/sudoers",
      "/host/etc/sudoers.d/%"
    ],
    "ssh": [
      "/host/etc/ssh/%",
      "/host/root/.ssh/%",
      "/host/home/%/.ssh/%"
    ],
    "cron": [
      "/host/etc/crontab",
      "/host/etc/cron.d/%",
      "/host/var/spool/cron/crontabs/%"
    ],
    "binaries": [
      "/host/usr/bin/%",
      "/host/usr/sbin/%",
      "/host/usr/local/bin/%",
      "/host/usr/local/sbin/%"
    ]
  }
}
