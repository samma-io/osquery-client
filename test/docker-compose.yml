# End-to-end test: client -> gateway (mutual TLS) -> throwaway NATS.
# Run through test/e2e.sh, which creates a throwaway CA and sets E2E_PKI.
name: osquery-client-e2e
services:
  nats:
    image: nats:2.12.4-alpine
    command: ["-js"]

  nats-init:
    image: natsio/nats-box:0.19.3
    depends_on: [nats]
    command:
      - sh
      - -c
      - |
        until nats -s nats://nats:4222 stream add E2E_LOGS --subjects samma.logs.osquery --storage memory \
          --retention limits --discard old --max-age 1h --max-bytes 64MiB --max-msgs=-1 --max-msg-size=-1 \
          --max-msgs-per-subject=-1 --dupe-window 2m --replicas 1 --no-allow-rollup --no-deny-delete \
          --no-deny-purge --defaults >/dev/null 2>&1; do sleep 1; done
        echo stream ready

  gateway:
    image: timberio/vector:0.53.0-distroless-libc
    depends_on:
      nats-init: {condition: service_completed_successfully}
    command: ["--config", "/etc/osquery-gateway/vector.yaml"]
    environment:
      NATS_URL: nats://nats:4222
      TLS_DIR: /etc/osquery-gateway/tls
    volumes:
      - ../gateway/vector.yaml:/etc/osquery-gateway/vector.yaml:ro
      - ../gateway/osquery.vrl:/etc/osquery-gateway/osquery.vrl:ro
      - ${E2E_PKI:?run test/e2e.sh}/server:/etc/osquery-gateway/tls:ro
    networks:
      default:
        aliases: [osquery-gateway]

  client:
    build: ..
    depends_on: [gateway]
    hostname: e2e-client
    environment:
      OSQUERY_GATEWAY: osquery-gateway:8443
      OSQUERY_TLS_PERIOD: "2"
    volumes:
      - ${E2E_PKI}/client:/etc/osquery/certs:ro
      - ./osquery.e2e.conf:/etc/osquery/osquery.conf:ro
